; DT Brand's Hostinger PHP Configuration
; This file auto-applies to all PHP scripts in this directory

; Error reporting — log all, display none (production safe)
display_errors = Off
log_errors = On
error_reporting = E_ALL

; Memory & execution limits
memory_limit = 512M
max_execution_time = 300
post_max_size = 128M
upload_max_filesize = 64M

; Session security
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 86400

; Timezone
date.timezone = "Asia/Kolkata"

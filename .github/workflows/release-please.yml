name: Automated Release Management (Release Please)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@7987652d64c45816db54114860d8ae579867df92 # v4.1.3
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
